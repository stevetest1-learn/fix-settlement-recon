name: deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel the page loads
        # Rebuilt from source on every deploy rather than trusting the
        # committed copy, so the live tool can never drift from the tests
        # that just passed against this commit.
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          cp dist/fix_settlement_recon-*.whl web/

      - name: Regenerate sample scenarios
        run: python build_samples.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
